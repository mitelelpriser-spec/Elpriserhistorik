name: Opdater tariffer

on:
  schedule:
    - cron: "43 */6 * * *"  # fire gange i døgnet; kun filer ældre end 6 dage hentes igen
  workflow_dispatch: {}      # kan også startes med hånden under fanen Actions

permissions:
  contents: write

# Kun én tarifkørsel ad gangen (en lang kørsel må ikke overlappe den næste)
concurrency:
  group: tariffer
  cancel-in-progress: false

jobs:
  tariffs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent tariffer (70 sekunders pause mellem opslag)
        run: python scripts/tariffs.py
      - name: Gem ændringer
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Opdater tariffer"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
